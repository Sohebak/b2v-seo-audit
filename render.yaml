services:
  - type: web
    name: b2v-seo-audit
    env: node
    region: oregon
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y chromium-browser
      npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: true
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium-browser
      # Optimize memory usage
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      # API keys - set these in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GOOGLE_PAGESPEED_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: Business2Virtual SEO Audit